<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <!-- WEB: cartoon globe. Hand-written; Toontown sticker style (shadow, thick ink outline, bevel, highlight). -->
  <defs>
    <radialGradient id="sea" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#b8ecff"/>
      <stop offset="0.55" stop-color="#4fb8f0"/>
      <stop offset="1" stop-color="#1f74c8"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e05a"/>
      <stop offset="1" stop-color="#4f9e2a"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="32" cy="32" r="25"/></clipPath>
  </defs>
  <circle cx="33.5" cy="34" r="25" fill="#000" opacity="0.28" stroke="#000" stroke-width="9"/>
  <circle cx="32" cy="32" r="25" fill="#241509" stroke="#241509" stroke-width="9"/>
  <circle cx="32" cy="32" r="25" fill="url(#sea)"/>
  <g clip-path="url(#ball)" stroke="#241509" stroke-width="2.6" stroke-linejoin="round" fill="url(#land)">
    <!-- the Americas, big and bubbly -->
    <path d="M12 14 C18 8 30 9 31 15 C32 20 26 21 25 26 C24 31 30 33 31 38 C32 44 27 50 24 57 C20 56 19 49 20 44 C21 39 15 37 13 32 C11 27 6 21 12 14 Z"/>
    <!-- Europe / Africa lump -->
    <path d="M40 10 C47 9 56 14 57 22 C57 27 52 27 50 31 C48 36 53 40 51 46 C49 51 43 52 42 46 C41 41 37 39 38 33 C39 28 44 27 42 22 C40 18 35 13 40 10 Z"/>
  </g>
  <!-- bevel: dark lower-right rim and glossy upper-left shine -->
  <path d="M51 20 A25 25 0 0 1 20 54 A22 22 0 0 0 51 20 Z" fill="#0b2f6a" opacity="0.35"/>
  <ellipse cx="22" cy="19" rx="9" ry="5.5" transform="rotate(-35 22 19)" fill="#fff" opacity="0.7"/>
  <circle cx="15.5" cy="28" r="2.2" fill="#fff" opacity="0.6"/>
</svg>
