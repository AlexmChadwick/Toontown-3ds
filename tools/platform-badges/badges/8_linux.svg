    <path id="mon" d="M5 12 Q5 6 11 6 L53 6 Q59 6 59 12 L59 40 Q59 46 53 46 L38 46 L39 51 L47 51 Q51 51 51 55 Q51 58 47 58 L17 58 Q13 58 13 55 Q13 51 17 51 L25 51 L26 46 L11 46 Q5 46 5 40 Z"/>
