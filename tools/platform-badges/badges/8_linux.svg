      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.55" stop-color="#f2d77a"/>
      <stop offset="1" stop-color="#c79a2e"/>
    </linearGradient>
    <linearGradient id="crt" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3b4f8c"/>
